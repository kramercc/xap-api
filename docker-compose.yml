services:
  # Dependency validation service

  demo-xap:
    #image: gigaspaces/smart-cache-enterprise:16.4.3
    image: demo/demo-xap:17.1.2
    container_name: demo-xap
    command: host run-agent --manager --gsc=3 # replace parameters passed to docker entrypoint.sh (gs.sh)
    ports:
      - "8090:8090"
      - "8099:8099"
      - "4174:4174"
      - "8200-8300:8200-8300"
    environment:
      GS_LICENSE: "tryme" # Use your license key
      GS_HEAP: "2g"
      GS_GSA_OPTIONS: "-Xms128m -Xmx128m"
      GS_GSC_OPTIONS: "-Xms4096m -Xmx4096m -Dspring.profiles.active=giga_unsecured -Dcom.gs.zones=demo-local"
    volumes:
      - ./scripts:/opt/gigaspaces/scripts:ro
      - ./target/lib/commons-pool-1.6.jar:/opt/gigaspaces/lib/optional/pu-common/commons-pool-1.6.jar:ro
      - ./target/lib/commons-dbcp-1.4.jar:/opt/gigaspaces/lib/optional/pu-common/commons-dbcp-1.4.jar:ro
      - ./target/lib/ojdbc8-12.2.0.1.jar:/opt/gigaspaces/lib/optional/pu-common/ojdbc8-12.2.0.1.jar:ro
    healthcheck:
      test: ["CMD", "/bin/bash", "/opt/gigaspaces/scripts/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: "no"
    networks:
      - xap-net


  demo-api:
    image: demo/demo-xap:17.1.2
    container_name: demo-api
    entrypoint: ["/bin/sh", "-c", "echo 'Starting GigaSpaces...'; tail -f /dev/null"]
    depends_on:
      demo-xap:
        condition: service_healthy
    volumes:
      - ./scripts:/opt/gigaspaces/deploy/scripts
    post_start:
      - command: "/opt/gigaspaces/deploy/scripts/gsDeploy.sh"
    restart: "no"
    networks:
      - xap-net

networks:
  xap-net:
    driver: bridge
